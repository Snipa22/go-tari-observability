# Scrape config snippet for go-tari-observability's tari-exporter.
#
# Merge this into a Prometheus server's scrape_configs list. Adjust the target below to
# wherever tari-exporter is actually deployed (host:port, DNS name, service discovery,
# etc.) — "tari-exporter:9469" is a placeholder assuming a Docker Compose / Kubernetes
# service named "tari-exporter" listening on the exporter's default port.
scrape_configs:
  - job_name: tari-observability
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - tari-exporter:9469 # placeholder — replace with the real deployment target
